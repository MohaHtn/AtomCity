name: iOS starter workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096M -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Create apikeys.properties
        env:
          APIKEYS_PROPERTIES: ${{ secrets.APIKEYS_PROPERTIES }}
        run: printf '%s' "$APIKEYS_PROPERTIES" > apikeys.properties

      - name: Build Android debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app/build/outputs/apk/debug/*.apk

  build-ios:
    name: Build iOS simulator app
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Create apikeys.properties
        env:
          APIKEYS_PROPERTIES: ${{ secrets.APIKEYS_PROPERTIES }}
        run: printf '%s' "$APIKEYS_PROPERTIES" > apikeys.properties

      - name: Build iOS simulator app
        run: |
          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -configuration Release \
            -scheme iosApp \
            -sdk iphonesimulator \
            -derivedDataPath ./build \
            -verbose

      - name: Upload app folder
        uses: actions/upload-artifact@v4
        with:
          name: iphonesimulator-app
          path: build/Build/Products/Release-iphonesimulator/*