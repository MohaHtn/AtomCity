name: iOS starter workflow

on:
  push:
    tags:
      - v*
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096M -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

permissions:
  contents: write


jobs:
  release-android:
    name: Build and publish Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Create apikeys.properties
        env:
          APIKEYS_PROPERTIES: ${{ secrets.APIKEYS_PROPERTIES }}
        run: printf '%s' "$APIKEYS_PROPERTIES" > apikeys.properties

      - name: Restore Android signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$GITHUB_WORKSPACE/release.jks"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: ./gradlew :app:assembleRelease

      - name: Prepare release APK
        run: |
          cp app/release/app-release.apk \
             "AtomCity-${GITHUB_REF_NAME}.apk"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AtomCity-${{ github.ref_name }}
          path: AtomCity-${{ github.ref_name }}.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "AtomCity-${GITHUB_REF_NAME}.apk" \
            --title "AtomCity $GITHUB_REF_NAME" \
            --generate-notes

  build-ios:
    name: Build iOS simulator app
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Create apikeys.properties
        env:
          APIKEYS_PROPERTIES: ${{ secrets.APIKEYS_PROPERTIES }}
        run: printf '%s' "$APIKEYS_PROPERTIES" > apikeys.properties

      - name: Build iOS simulator app
        run: |
          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload app folder
        uses: actions/upload-artifact@v4
        with:
          name: iphonesimulator-app
          path: build/Build/Products/Release-iphonesimulator/*.app