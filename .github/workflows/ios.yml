name: AtomCity CI and Release

on:
  push:
    tags:
      - "v*"
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.jvmargs=-Xmx4096M
    -Dorg.gradle.daemon=false
    -Dorg.gradle.parallel=true
    -Dorg.gradle.caching=true

permissions:
  contents: read

jobs:
  build-android:
    name: Build signed Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Create apikeys.properties
        env:
          APIKEYS_PROPERTIES: ${{ secrets.APIKEYS_PROPERTIES }}
        run: printf '%s' "$APIKEYS_PROPERTIES" > apikeys.properties

      - name: Restore Android signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$GITHUB_WORKSPACE/release.jks"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Show generated APK files
        run: find app/build/outputs -type f -name "*.apk"

      - name: Prepare release APK
        run: |
          cp \
            app/build/outputs/apk/release/app-release.apk \
            "AtomCity-${GITHUB_REF_NAME}.apk"

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: AtomCity-${{ github.ref_name }}.apk
          if-no-files-found: error

  build-ios:
    name: Build unsigned iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Create apikeys.properties
        env:
          APIKEYS_PROPERTIES: ${{ secrets.APIKEYS_PROPERTIES }}
        run: printf '%s' "$APIKEYS_PROPERTIES" > apikeys.properties

      - name: Build unsigned iOS device app
        run: |
          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Show generated iOS applications
        run: |
          find "$GITHUB_WORKSPACE/build" \
            -type d \
            -name "*.app"

      - name: Package unsigned IPA
        run: |
          mkdir -p "$GITHUB_WORKSPACE/ipa/Payload"

          cp -R \
            "$GITHUB_WORKSPACE/build/Build/Products/Release-iphoneos/iosApp.app" \
            "$GITHUB_WORKSPACE/ipa/Payload/"

          cd "$GITHUB_WORKSPACE/ipa"

          zip -qry \
            "$GITHUB_WORKSPACE/AtomCity-${GITHUB_REF_NAME}-unsigned.ipa" \
            Payload

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: AtomCity-${{ github.ref_name }}-unsigned.ipa
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    if: startsWith(github.ref, 'refs/tags/v')

    needs:
      - build-android
      - build-ios

    permissions:
      contents: write

    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v5
        with:
          name: android-release-apk
          path: release-files

      - name: Download iOS IPA
        uses: actions/download-artifact@v5
        with:
          name: ios-unsigned-ipa
          path: release-files

      - name: Show release files
        run: find release-files -type f

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
          then
            gh release upload "$GITHUB_REF_NAME" \
              release-files/*.apk \
              release-files/*.ipa \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              release-files/*.apk \
              release-files/*.ipa \
              --repo "$GITHUB_REPOSITORY" \
              --title "AtomCity $GITHUB_REF_NAME" \
              --generate-notes
          fi